<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4차시 ① 가이드 점검하고 나누기 — 디지털 시민</title>
<link rel="stylesheet" href="common.css?v=4">
<style>
.open-btn { display: inline-block; background: var(--accent); color: #fff !important; text-decoration: none; border-radius: 10px; padding: 8px 14px; font-size: 0.84rem; font-weight: 700; margin: 6px 0 2px; }
.nolink { font-size: 0.78rem; color: var(--text-muted); margin: 6px 0 2px; }
.tool-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.tool-chips span { background: #f3f0ff; color: #5f3dc4; border-radius: 999px; padding: 2px 10px; font-size: 0.76rem; font-weight: 700; }
.intro { font-size: 0.95rem; font-weight: 700; line-height: 1.55; }
.chk-badge { font-size: 0.72rem; color: #2b8a3e; background: #ebfbee; border-radius: 6px; padding: 1px 6px; font-weight: 700; }
.dc-info:has(.chk-tip) { background: #f3f0ff; border-left-color: #7950f2; }
</style>
</head>
<body>
<div class="wrap">
  <div id="dc-head"></div>

  <div class="concept">
    <h3>✅ 3단계 · 점검하고 나눌 준비하기 (p.39)</h3>
    <p style="margin:0">완성한 가이드를 꼼꼼히 점검하고, 한 문장으로 소개해 친구들과 나눠요. 아래 갤러리에서 친구들의 가이드를 열어 보고 댓글을 남길 수 있어요.</p>
  </div>

  <div id="form"></div>
  <div id="board"></div>
</div>

<script src="session.js?v=4"></script>
<script src="dc.js?v=4"></script>
<script>
const CHECKS = [
  '내용 구성 — 두 도구의 적합한 상황과 부적합한 상황, 나만의 요령을 빠짐없이 담았는가?',
  '인간의 판단 — 잘못된 정보와 글자 오류를 직접 확인해 고치고, 참고한 출처를 표시했는가?',
  '시각 구성 — 그림, 아이콘, 표, 화살표 등을 활용해 내용을 한눈에 이해할 수 있게 구성했는가?',
  '독자의 눈높이 — 가이드를 볼 사람이 이해할 수 있는 쉬운 표현을 사용했는가?',
];
const SHARE = [
  '보는 사람이 오해하거나 잘못 따라할 수 있는 표현은 없는가?',
  '다른 사람이 만든 그림·사진·글을 허락 없이 가져다 쓰지 않았는가?',
  '전시 공간을 확인하고 출력, 부착 준비를 마쳤는가?',
];
const GROUPS = [
  { title: '1. 완성한 가이드 점검', fields: [
    { id: 'checks', type: 'checks', short: '점검 항목', label: '확인한 항목에 체크하세요', options: CHECKS },
  ] },
  { title: '2. 한 문장으로 소개하기', fields: [
    { id: 'intro', type: 'textarea', rows: 2, short: '한 문장 소개', label: '나누기 전에 내가 만든 가이드를 한 문장으로 소개해 보자.' },
    { id: 'link', type: 'text', short: '가이드 링크', label: '가이드 링크', placeholder: 'https://...', hint: '3차시에 적어 둔 링크가 있으면 자동으로 채워져요. 친구들이 열 수 있도록 보기 권한을 확인하세요. (http로 시작하는 링크만 열기 버튼이 만들어져요.)' },
  ] },
  { title: '📣 확산하기 · 공유 전 체크 (p.41)', fields: [
    { type: 'info', html: '<span class="chk-tip"></span>가이드를 출력해 복도·게시판·도서관 등 교내 공간에 전시하기 전에 정보가 정확한지, 그림·사진·글을 올바르게 사용했는지 확인해요.' },
    { id: 'share', type: 'checks', short: '공유 전 체크', label: '교내 전시로 책임 있게 공유하기', options: SHARE },
  ] },
];

const isUrl = s => /^https?:\/\/\S+$/i.test(s || '');
let guides = {}, bd;

DC.start({ title: '4차시 ① 가이드 점검하고 나누기', subtitle: '우리의 배움을 어떻게 되돌아보고 실천할 수 있을까?' }).then(() => {
  DC.form({
    mount: '#form', key: 's4/check', title: '🔍 점검표', groups: GROUPS, required: ['intro'],
    onLoad: rec => {
      const input = document.querySelector('[data-fid="link"]');
      if (input && !input.value.trim()) {
        DC.get('s3/guide/' + DC.myBan() + '/' + DC.student.id).then(g => {
          const l = g && g.answers && g.answers.link;
          if (l && !input.value.trim()) input.value = l;
        }).catch(() => {});
      }
    },
  });

  bd = DC.board({
    mount: '#board', key: 's4/check', title: '🖼️ 우리 반 가이드 갤러리', sort: 'recent',
    commentPlaceholder: '이 가이드에서 새로 알게 된 점 / 보완하면 좋을 점',
    hint: '친구의 가이드를 열어 보고, 댓글에 "이 가이드에서 새로 알게 된 점"과 "보완하면 좋을 점"을 남겨 주세요.',
    cardHtml: r => {
      const a = r.answers, g = (guides[r.id] || {}).answers || {};
      const names = [g.t1_name, g.t2_name].filter(Boolean);
      const n = Array.isArray(a.checks) ? a.checks.length : 0;
      return '<div class="intro">' + DC.nl2br(a.intro) + '</div>' +
        (names.length ? '<div class="tool-chips">' + names.map(x => '<span>🔧 ' + DC.esc(x) + '</span>').join('') + '</div>' : '') +
        (isUrl(a.link) ? '<a class="open-btn" href="' + DC.escAttr(a.link) + '" target="_blank" rel="noopener">🔗 가이드 열기</a>'
          : '<div class="nolink">아직 열 수 있는 링크가 없어요.</div>') +
        ' <span class="chk-badge">점검 ' + n + '/4</span>';
    },
  });

  // 도구 이름 보강: 우리 반 s3/guide를 한 번만 불러온다
  DC.get('s3/guide/' + DC.myBan()).then(d => { guides = d || {}; bd.reload(); }).catch(() => {});

});
</script>
</body>
</html>
